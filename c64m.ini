; RailGunner — project c64m config
; Launch: tools/run-emulator.sh → tools/launch_railgunner.py
; Paths that are not absolute are resolved relative to this INI's directory.

[Video]
standard=PAL
true_aspect=true

[config]
; Keep this file stable under git; do not rewrite on quit.
Save=false
turbo_speeds=1,2,3
scroll_wheel_lines=3

[roms]
; Sibling c64m checkout (../c64m from this repo root)
single_system=true
system=../c64m/roms/system.rom
character=../c64m/roms/character.rom
1541=../c64m/roms/1541.rom

[assembler]
; Root source for the Assembler tab (Shift+Opt+A). Preferred launch still uses
; tools/launch_railgunner.py: remote assemble + paste RUN (no auto-run PC poke).
file=src/main.asm
use_address=no
address=8000
auto_run=no
run_address=080d
reset=no
rearm_oneshots=no

; [input] intentionally omitted — keyboard_joystick_* is a user preference.
; The game reads joy port 2 and the keyboard matrix itself.

[disk]
emulate_1541=true
media_1541=true
show_disk_leds=true

[browse]
assembler=src
program=build
snapshot=build

; Forensic budgets (defaults are fine for most dogfood sessions).
; Uncomment / raise if frame-ring-info or vic-ring-info shows dropped= while
; hunting one-frame glitches, or if history-find needs a longer window.
; Default runtime can ask for ~400 MiB (history + frame ring + VIC ring).
; [debug]
; history_memory_mb=256
; frame_ring_memory_mb=128
; ; ~827 PAL frames at 128 MiB (~16.5 s). 0 disables.
; vic_ring_memory_mb=16
; ; ~500 PAL frames of per-line state at 16 MiB (~10 s). 0 disables (and
; ; recovers the per-line cost; vic-ring-record off does not).
